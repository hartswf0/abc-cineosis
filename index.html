<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ABC-CINEOSIS · SYSTEM MAIN CONTROL</title>
  <style>
    :root {
      --ink: #000000;
      --paper: #ffffff;
      --font: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* Absolute White and Black Stripe Background (Preserves density, rejects glassmorphism) */
    .stripe-pattern {
      background: repeating-linear-gradient(
        -45deg,
        var(--ink),
        var(--ink) 4px,
        var(--paper) 4px,
        var(--paper) 8px
      );
      height: 12px;
      border: 2px solid var(--ink);
      margin-bottom: 10px;
    }
    header {
      border: 4px solid var(--ink);
      background-color: var(--paper);
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }
    h1 {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      background-color: var(--ink);
      color: var(--paper);
      display: inline-block;
      padding: 4px 8px;
    }
    .meta-subtitle {
      font-size: 11px;
      margin-top: 8px;
      text-transform: uppercase;
      font-weight: 900;
    }
    #workspace-grid {
      display: grid;
      grid-template-columns: 320px 1fr 1fr;
      gap: 15px;
      flex: 1;
      min-height: 0;
    }
    .pane {
      border: 4px solid var(--ink);
      display: flex;
      flex-direction: column;
      background-color: var(--paper);
      min-height: 0;
    }
    .pane-title {
      background-color: var(--ink);
      color: var(--paper);
      font-size: 11px;
      font-weight: 900;
      padding: 8px 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
      border-bottom: 4px solid var(--ink);
    }
    .pane-content {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    /* Spatial Stack: Anchored to the Ground Line at the Base */
    .stack-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
    }
    .file-stack {
      display: flex;
      flex-direction: column-reverse; /* Bottom-up rendering: a1 at bottom, c2 at top */
      gap: 10px;
    }
    .ground-line {
      height: 8px;
      background-color: var(--ink);
      width: 100%;
      margin-top: 8px;
    }
    .file-card {
      border: 3px solid var(--ink);
      background-color: var(--paper);
      color: var(--ink);
      padding: 12px;
      cursor: pointer;
      transition: background-color 0.05s, color 0.05s;
    }
    .file-card:hover {
      background-color: var(--ink);
      color: var(--paper);
    }
    .file-card.active {
      background-color: var(--ink);
      color: var(--paper);
    }
    .file-card h2 {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .file-card p {
      font-size: 10px;
      margin-top: 4px;
      line-height: 1.3;
    }
    /* Layout Viewport / Schematic Grid */
    .viewport-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }
    .schematic-grid {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      flex: 1;
      margin-bottom: 15px;
    }
    .schematic-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .schematic-cols-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .schematic-box {
      border: 3px solid var(--ink);
      background-color: var(--paper);
      color: var(--ink);
      padding: 12px;
      text-align: center;
      font-weight: 900;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.05s, color 0.05s;
    }
    .schematic-box:hover {
      background-color: var(--ink);
      color: var(--paper);
    }
    .schematic-box.highlight {
      background-color: var(--ink);
      color: var(--paper);
      box-shadow: inset 0 0 0 3px var(--paper);
    }
    /* XML Script View (Text operates as a physical control surface) */
    .xml-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .xml-line {
      border-bottom: 2px solid var(--ink);
      padding: 10px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.4;
      background-color: var(--paper);
      color: var(--ink);
      transition: background-color 0.05s, color 0.05s;
      white-space: pre-wrap;
    }
    .xml-line:hover {
      background-color: var(--ink);
      color: var(--paper);
    }
    .xml-line.highlight {
      background-color: var(--ink);
      color: var(--paper);
    }
    .tag-blue { font-weight: 900; }
    .attr-name { font-weight: 900; }
    
    .action-container {
      margin-top: auto;
      padding-top: 10px;
      border-top: 3px solid var(--ink);
    }
    .launch-btn {
      display: block;
      width: 100%;
      text-align: center;
      border: 3px solid var(--ink);
      background-color: var(--ink);
      color: var(--paper);
      padding: 12px;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .08em;
      cursor: pointer;
      transition: background-color 0.05s, color 0.05s;
    }
    .launch-btn:hover {
      background-color: var(--paper);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="stripe-pattern"></div>
  <header>
    <h1>ABC-CINEOSIS SYSTEM</h1>
    <div class="meta-subtitle">Tactile Multi-Module Workspace Launcher &amp; Bidirectional Control Surface</div>
  </header>

  <div id="workspace-grid">
    <!-- FILE LIST PANEL (SPATIAL STACK) -->
    <div class="pane">
      <div class="pane-title">🗂️ Workspace Stack (Ground Anchored)</div>
      <div class="pane-content">
        <div class="stack-wrapper">
          <div class="file-stack" id="file-stack">
            <!-- Populated dynamically: stacked from bottom up -->
          </div>
          <div class="ground-line"></div>
        </div>
      </div>
    </div>

    <!-- VIEWPORT PANELS -->
    <div class="pane">
      <div class="pane-title">🖥️ Viewport Schematic (Click Box)</div>
      <div class="pane-content">
        <div class="viewport-container" id="viewport-container">
          <div class="schematic-grid" id="schematic-grid">
            <!-- Rendered dynamically -->
          </div>
          <div class="action-container">
            <a class="launch-btn" id="launch-button" href="#" target="_blank">Launch Module ↗</a>
          </div>
        </div>
      </div>
    </div>

    <!-- CODE VIEW PANELS -->
    <div class="pane">
      <div class="pane-title">📜 POML XML Logic (Click Line)</div>
      <div class="pane-content" style="padding: 0;">
        <div class="xml-container" id="xml-editor">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const modules = [
      {
        id: "a1",
        name: "a1.html (Baseline)",
        path: "a1.html",
        description: "Initial prototype of the CAUSALITY platform with static timeline, storyboard views, and baseline Gemini API integrations.",
        viewport: [
          { type: "row", name: "STATUS", target: "status-monitor" },
          { type: "cols", boxes: [
            { name: "PREMISE", target: "premise-input" },
            { name: "CHAT", target: "prompt-generator" }
          ]},
          { type: "row", name: "STORYBOARD", target: "storyboard-canvas" }
        ],
        script: [
          { id: "premise-input", action: "Operator inputs narrative premise text into outline field" },
          { id: "prompt-generator", action: "Compile premise and outline to output raw generative prompt" },
          { id: "storyboard-canvas", action: "Renders static storyboard scene cells from mock API stream" },
          { id: "status-monitor", action: "Status bar reports mock API state and frame counts" }
        ]
      },
      {
        id: "b1",
        name: "b1.html (Multi-API Hardened)",
        path: "b1.html",
        description: "Hardened version supporting Gemini, Claude, and OpenAI keys with all local fallback dummies completely stripped.",
        viewport: [
          { type: "row", name: "KEYS MODAL", target: "api-config" },
          { type: "cols", boxes: [
            { name: "MODEL SELECT", target: "model-select" },
            { name: "CHAT", target: "chat-stream" }
          ]},
          { type: "row", name: "STATUS", target: "error-fallback" }
        ],
        script: [
          { id: "api-config", action: "Accepts raw API key configurations for multiple providers" },
          { id: "model-select", action: "Operator selects model provider and tag dynamically" },
          { id: "chat-stream", action: "Streams authentic responses directly to the chat window" },
          { id: "error-fallback", action: "Surfaces raw API error states; strips dummy backup fallbacks" }
        ]
      },
      {
        id: "b2",
        name: "b2.html (Causal Navigator)",
        path: "b2.html",
        description: "Build sheet with automated SCRIPT auto-saving and interactive Causal Chain status tooltips.",
        viewport: [
          { type: "row", name: "KEY TRIGGER", target: "key-trigger" },
          { type: "cols", boxes: [
            { name: "SCRIPT INPUT", target: "script-textarea" },
            { name: "AUTO-SAVE ENGINE", target: "persistence-engine" }
          ]},
          { type: "row", name: "STATUS RAIL", target: "status-rail" }
        ],
        script: [
          { id: "script-textarea", action: "Monitors text changes on script input and triggers auto-save" },
          { id: "status-rail", action: "Updates script word counts and pips in status rails" },
          { id: "persistence-engine", action: "Saves data automatically on every keystroke to local storage" },
          { id: "key-trigger", action: "Key button opens status bar configuration modal" }
        ]
      },
      {
        id: "c1",
        name: "c1.html (Canvas Draw)",
        path: "c1.html",
        description: "Baseline editor for color palette draw operations, stamps, and pixel cell timeline rendering.",
        viewport: [
          { type: "cols", boxes: [
            { name: "TOOLBAR", target: "tool-palette" },
            { name: "STAMP INPUT", target: "stamp-tool" }
          ]},
          { type: "row", name: "DRAW CANVAS", target: "canvas-grid" },
          { type: "row", name: "TIMELINE", target: "timeline-frames" }
        ],
        script: [
          { id: "canvas-grid", action: "Tracks pen, box, and eraser tools on the 128x96 pixel canvas" },
          { id: "tool-palette", action: "Toggles tool state and sets active color palette value" },
          { id: "stamp-tool", action: "Stamps alphanumeric text characters directly onto frames" },
          { id: "timeline-frames", action: "Sequences and plays timeline frames at custom frame rates" }
        ]
      },
      {
        id: "c2",
        name: "c2.html (Semiotics Triad)",
        path: "c2.html",
        description: "Fully fortified interface featuring the live Attention-Tax Semiotic Triad Analyzer.",
        viewport: [
          { type: "cols", boxes: [
            { name: "PREMISE", target: "descriptive-world" },
            { name: "IMPLICATURE DEBT", target: "interpretive-significance" }
          ]},
          { type: "row", name: "SEMIOTICS TAB", target: "operative-action" },
          { type: "row", name: "REALIGN BUTTON", target: "realign-horizons" }
        ],
        script: [
          { id: "descriptive-world", action: "Maps the narrative world register: monitors active premise/title" },
          { id: "interpretive-significance", action: "Evaluates token pressure (KV-cache) and implicature debt" },
          { id: "operative-action", action: "Triggers BEFLIX rendering pipelines on the frames" },
          { id: "realign-horizons", action: "AI evaluates narrative alignment via the Chat panel" }
        ]
      }
    ];

    let currentModuleId = "c2";

    function selectModule(id) {
      currentModuleId = id;
      
      // Update Stack Selection UI
      document.querySelectorAll('.file-card').forEach(card => card.classList.remove('active'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) activeCard.classList.add('active');

      const mod = modules.find(m => m.id === id);
      if (!mod) return;

      // Update Launch Button Link
      const btn = document.getElementById('launch-button');
      btn.href = mod.path;
      btn.textContent = `Launch ${mod.name} ↗`;

      // Render Viewport Layout
      const grid = document.getElementById('schematic-grid');
      grid.innerHTML = '';
      mod.viewport.forEach(item => {
        if (item.type === "row") {
          const rowEl = document.createElement('div');
          rowEl.className = 'schematic-row';
          rowEl.innerHTML = `<div class="schematic-box" id="box-${item.target}" onclick="highlightBinding('${item.target}')">${item.name}</div>`;
          grid.appendChild(rowEl);
        } else if (item.type === "cols") {
          const colsEl = document.createElement('div');
          colsEl.className = 'schematic-cols-2';
          colsEl.innerHTML = item.boxes.map(box => `
            <div class="schematic-box" id="box-${box.target}" onclick="highlightBinding('${box.target}')">${box.name}</div>
          `).join('');
          grid.appendChild(colsEl);
        }
      });

      // Render POML XML Lines
      const xml = document.getElementById('xml-editor');
      xml.innerHTML = `
        <div style="padding: 10px; border-bottom: 2px solid var(--ink); font-weight: 900; font-size: 12px; background-color: var(--ink); color: var(--paper);">
          &lt;poml version="2.0"&gt;
        </div>
      `;
      mod.script.forEach((line, index) => {
        const stepNum = index + 1;
        const lineEl = document.createElement('div');
        lineEl.className = 'xml-line';
        lineEl.id = `line-${line.id}`;
        lineEl.onclick = () => highlightBinding(line.id);
        
        lineEl.innerHTML = `&lt;<span class="tag-blue">execution</span> <span class="attr-name">step</span>="${stepNum}" <span class="attr-name">target</span>="${line.id}"&gt;\n  ${line.action}\n&lt;/<span class="tag-blue">execution</span>&gt;`;
        xml.appendChild(lineEl);
      });
      xml.innerHTML += `
        <div style="padding: 10px; font-weight: 900; font-size: 12px; background-color: var(--ink); color: var(--paper);">
          &lt;/poml&gt;
        </div>
      `;
    }

    // Bidirectional highlighting mechanism
    function highlightBinding(targetId) {
      // Clear previous highlights
      document.querySelectorAll('.schematic-box').forEach(box => box.classList.remove('highlight'));
      document.querySelectorAll('.xml-line').forEach(line => line.classList.remove('highlight'));

      // Highlight the box
      const boxEl = document.getElementById(`box-${targetId}`);
      if (boxEl) boxEl.classList.add('highlight');

      // Highlight the xml line
      const lineEl = document.getElementById(`line-${targetId}`);
      if (lineEl) {
        lineEl.classList.add('highlight');
        lineEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function renderStack() {
      const stack = document.getElementById('file-stack');
      stack.innerHTML = modules.map(m => `
        <div class="file-card" id="card-${m.id}" onclick="selectModule('${m.id}')">
          <h2>${m.name}</h2>
          <p>${m.description}</p>
        </div>
      `).join('');
    }

    // Initialize
    renderStack();
    selectModule("c2");
  </script>
</body>
</html>
